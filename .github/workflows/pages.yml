name: Deploy GitHub Pages
run-name: Deploy main at ${{ github.sha }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_URL: https://khookh.github.io/zenvallei/
      VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}
      VITE_TILE_ATTRIBUTION: ${{ vars.VITE_TILE_ATTRIBUTION }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            playground/ndvi/pyproject.toml
            processing/local-layers/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NDVI playground dependencies
        run: python -m pip install --editable "playground/ndvi[dev]"

      - name: Install local raster preparation dependencies
        run: python -m pip install --editable "processing/local-layers[test]"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify NDVI playground
        id: python_verification
        run: python -m pytest playground/ndvi/tests -q

      - name: Verify local raster preparation
        run: python -m pytest processing/local-layers/tests -q

      - name: Verify application
        id: application_verification
        run: pnpm verify:ci

      - name: Verify local raster map mode
        run: pnpm test:local-data

      - name: Build GitHub Pages artifact
        id: pages_build
        run: pnpm build:pages

      - name: Record release identity
        id: release_manifest
        run: >-
          node scripts/write-release-manifest.mjs
          --root dist
          --sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"

      - name: Upload GitHub Pages artifact
        id: artifact_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy GitHub Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify the published commit
        id: live_verification
        if: always() && steps.artifact_upload.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: >-
          node scripts/verify-pages-release.mjs
          --url "$PAGES_URL"
          --sha "$EXPECTED_SHA"
          --timeout-ms 300000
          --interval-ms 5000

      - name: Smoke-test the live application
        id: live_application
        if: steps.live_verification.outcome == 'success'
        env:
          LIVE_PAGES_URL: ${{ env.PAGES_URL }}
        run: pnpm test:live-pages

      - name: Summarise deployment
        if: always()
        env:
          REQUESTED_SHA: ${{ github.sha }}
          PYTHON_OUTCOME: ${{ steps.python_verification.outcome }}
          APPLICATION_OUTCOME: ${{ steps.application_verification.outcome }}
          BUILD_OUTCOME: ${{ steps.pages_build.outcome }}
          MANIFEST_OUTCOME: ${{ steps.release_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.artifact_upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verification.outcome }}
          LIVE_APPLICATION_OUTCOME: ${{ steps.live_application.outcome }}
          LIVE_FAILURE_CODE: ${{ steps.live_verification.outputs.failure_code }}
          PUBLISHED_SHA: ${{ steps.live_verification.outputs.published_sha }}
        run: node scripts/write-deployment-summary.mjs
