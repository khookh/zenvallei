name: Verify application
run-name: Verify ${{ github.ref_name }} at ${{ github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full application verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}
      VITE_TILE_ATTRIBUTION: ${{ vars.VITE_TILE_ATTRIBUTION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            playground/ndvi/pyproject.toml
            processing/local-layers/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NDVI playground dependencies
        run: python -m pip install --editable "playground/ndvi[dev]"

      - name: Install local raster preparation dependencies
        # The verification suite imports the Optuna/XGBoost scenario pipeline,
        # so CI must install the same optional ML dependencies used locally.
        run: python -m pip install --editable "processing/local-layers[test,scenario-ml]"

      - name: Verify NDVI playground
        run: python -m pytest playground/ndvi/tests -q

      - name: Verify local raster preparation
        run: python -m pytest processing/local-layers/tests -q

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify application
        run: pnpm verify:ci

      - name: Verify local raster map mode
        run: pnpm test:local-data
