[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "greenwave-ndvi"
version = "0.1.0"
description = "Standalone NDVI exploration helpers for Greenwave"
requires-python = ">=3.11"
dependencies = [
  "dask[array]==2026.7.1",
  "geopandas==1.1.1",
  "ipykernel==7.3.0",
  "matplotlib==3.11.1",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "Pillow==12.0.0",
  "rasterio==1.4.4",
  "requests==2.32.5",
  "requests-oauthlib==2.0.0",
  "rioxarray==0.19.0",
  "shapely==2.1.2",
  "xarray==2026.7.0",
  "zarr==3.1.6",
]

[project.optional-dependencies]
dev = [
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["greenwave_ndvi*"]
